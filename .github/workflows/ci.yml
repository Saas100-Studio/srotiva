name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: srotiva_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srotiva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      CRAWLER_USER_AGENT: SrotivaCI/1.0 (+https://example.invalid/bot)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/srotiva_test?schema=public
      FETCH_MAX_BYTES: "2000000"
      FETCH_TIMEOUT_MS: "10000"
      MANUAL_REFRESH_COOLDOWN_SECONDS: "300"
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate environment
        run: bun run validate-env

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations to isolated test database
        run: bunx prisma migrate deploy

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Audit dependencies
        run: bun run audit:production

      - name: Run full verification
        run: bun run check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: srotiva_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srotiva_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://127.0.0.1:3100
      CRAWLER_USER_AGENT: SrotivaCI/1.0 (+https://example.invalid/bot)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/srotiva_e2e?schema=public
      FETCH_MAX_BYTES: "2000000"
      FETCH_TIMEOUT_MS: "10000"
      MANUAL_REFRESH_COOLDOWN_SECONDS: "300"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations to isolated E2E database
        run: bunx prisma migrate deploy

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build application
        run: bun run build

      - name: Run browser E2E and accessibility tests
        run: bun run test:e2e
